<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="书阁 Library">
<title>Bible Library · 圣经书阁</title>
<meta name="description" content="一间安静的中英双语读经室,一次一卷。A quiet, bilingual, expandable Scripture platform — Ecclesiastes, John, and more to come.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Bible Library · 圣经书阁">
<meta property="og:title" content="Bible Library · 圣经书阁">
<meta property="og:description" content="一间安静的中英双语读经室,一次一卷。A quiet bilingual Scripture platform.">
<meta property="og:image" content="https://sophia081927.github.io/under-the-sun-ecclesiastes/images/en/bridge.webp">
<meta property="og:url" content="https://sophia081927.github.io/under-the-sun-ecclesiastes/">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@300;400;500;600&family=Noto+Serif+SC:wght@400;500;600&family=Noto+Sans+SC:wght@300;400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: {
      fontFamily: {
        serif: ['"Playfair Display"', '"Noto Serif SC"', 'Georgia', 'serif'],
        sans:  ['Inter', '"Noto Sans SC"', 'system-ui', 'sans-serif'],
        mono:  ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
      },
      animation: { 'spin-slow': 'spin 9s linear infinite' },
    } },
  };
</script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>

<style>
  html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
  body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
  .book { transition: border-color .25s, transform .25s, box-shadow .25s; }
  .book.active:hover { border-color: rgba(212,175,55,.5); transform: translateY(-3px); box-shadow: 0 18px 40px rgba(0,0,0,.35); }
  .book.upcoming { opacity: .62; }
</style>
</head>

<body class="min-h-screen bg-[#12161A] text-[#F4F1EA] font-sans antialiased selection:bg-[#D4AF37]/30 flex flex-col">

  <!-- Header -->
  <header class="border-b border-gray-800 bg-[#12161A]/90 backdrop-blur-md px-5 md:px-8 py-4 flex justify-between items-center sticky top-0 z-50">
    <div class="flex items-center space-x-2">
      <i data-lucide="library" class="h-5 w-5 text-[#D4AF37]"></i>
      <span class="font-serif text-base md:text-lg tracking-widest uppercase font-bold text-[#D4AF37]">圣经书阁 <span class="text-gray-500 font-sans font-light hidden sm:inline">| Bible Library</span></span>
    </div>
    <div class="inline-flex border border-[#D4AF37]/40 rounded-full overflow-hidden text-xs">
      <button id="btnZh" class="px-3.5 py-2 min-h-[36px] tracking-wider text-gray-400" onclick="setLang('zh')">中文</button>
      <button id="btnEn" class="px-3.5 py-2 min-h-[36px] tracking-wider text-gray-400" onclick="setLang('en')">EN</button>
    </div>
  </header>

  <!-- Hero -->
  <section class="max-w-4xl mx-auto text-center pt-16 md:pt-20 pb-8 px-6 relative">
    <div class="absolute top-4 left-1/2 -translate-x-1/2 w-72 h-72 bg-[#D4AF37]/5 blur-[120px] rounded-full pointer-events-none"></div>
    <span class="text-xs font-mono tracking-[0.3em] text-[#D4AF37] uppercase mb-4 block" data-i18n="kicker"></span>
    <h1 class="font-serif text-3xl md:text-5xl font-bold leading-tight mb-5 tracking-wide text-transparent bg-clip-text bg-gradient-to-b from-[#F4F1EA] to-gray-400" data-i18n="title"></h1>
    <p class="text-gray-400 text-sm md:text-base max-w-2xl mx-auto leading-relaxed font-light" data-i18n="sub"></p>
  </section>

  <!-- Ask from Scripture (platform-level open-ended Q&A) -->
  <section class="max-w-4xl w-full mx-auto px-5 md:px-6 pb-8">
    <a href="ask.html" class="group block rounded-2xl border border-[#D4AF37]/30 bg-gradient-to-br from-[#D4AF37]/10 to-transparent p-6 md:p-7 transition-all hover:border-[#D4AF37]/60 hover:shadow-[0_18px_40px_rgba(0,0,0,.35)]">
      <div class="flex items-center gap-4 md:gap-5">
        <i data-lucide="message-circle" class="h-7 w-7 md:h-8 md:w-8 text-[#D4AF37] shrink-0"></i>
        <div class="flex-1 min-w-0">
          <span class="text-[10px] font-mono tracking-[0.22em] uppercase text-[#D4AF37]" data-i18n="askEyebrow"></span>
          <h2 class="font-serif text-xl md:text-2xl font-bold text-[#F4F1EA] mt-1" data-i18n="askTitle"></h2>
          <p class="text-gray-400 text-sm leading-relaxed font-light mt-1.5" data-i18n="askSub"></p>
        </div>
        <span class="hidden sm:inline-flex items-center gap-1.5 font-semibold text-xs tracking-wider uppercase px-5 py-3 rounded-full min-h-[46px] bg-[#D4AF37] text-[#12161A] shrink-0 transition-transform group-hover:translate-x-0.5" data-i18n="askBtn"></span>
      </div>
    </a>
  </section>

  <!-- Books (rendered from data/bibleRegistry.js) -->
  <section class="max-w-4xl w-full mx-auto px-5 md:px-6 pb-16 grid gap-5 md:grid-cols-2" id="books"></section>

  <div class="max-w-4xl w-full mx-auto px-6 pb-14 text-center text-gray-600 text-xs tracking-wide" data-i18n="more"></div>

  <!-- Footer -->
  <footer class="mt-auto py-8 text-center text-[10px] text-gray-600 tracking-widest uppercase border-t border-gray-950 px-6 leading-relaxed">
    &ldquo;He has also set eternity in the human heart.&rdquo; · 神将永恒安置在世人心里 &copy; 2026
  </footer>

<script type="module">
  import { bibleRegistry, featureLabels, resolveHash } from './data/bibleRegistry.js';

  // GitHub-Pages-safe hash routing: #/john/listen → john-listen.html (refresh-safe).
  function gotoHash() {
    if (location.hash && location.hash.indexOf('#/') === 0) {
      const file = resolveHash(location.hash);
      if (file) { location.replace(file); return true; }
    }
    return false;
  }
  window.addEventListener('hashchange', gotoHash);

  const UI = {
    zh: { kicker: '一次一卷,安静地读圣经', title: '圣经书阁',
          sub: '一个可以慢慢生长的中英双语读经空间。不急着说服你相信,只邀请你诚实地读。',
          more: '更多书卷陆续加入 · 只需在注册表里追加一条配置',
          askEyebrow: '本站核心 · 随便问', askTitle: '用圣经回应我的问题',
          askSub: '带着你真实的问题、疑惑与挣扎而来——关于空虚、焦虑、爱、苦难,或如何开始认识神——从传道书与约翰福音得到温柔、扎根圣经的回应。',
          askBtn: '开始提问',
          enter: '进入', listen: '聆听', soon: '敬请期待', comingType: '书卷筹备中' },
    en: { kicker: 'A quiet reading room, one book at a time', title: 'Bible Library',
          sub: 'A calm, growing bilingual space for reading Scripture. No pressure to believe — only an invitation to read honestly.',
          more: 'More books are on the way · just append one entry to the registry',
          askEyebrow: 'The heart of this site · Ask', askTitle: 'Ask from Scripture',
          askSub: 'Bring your real questions, doubts, and struggles — about emptiness, anxiety, love, suffering, or how to begin knowing God — and receive gentle, Scripture-centered guidance from Ecclesiastes and John.',
          askBtn: 'Start asking',
          enter: 'Enter', listen: 'Listen', soon: 'Coming soon', comingType: 'In preparation' },
  };

  let lang = 'zh';
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function cardHtml(b) {
    const t = UI[lang];
    const title = lang === 'zh' ? b.titleZh : b.titleEn;
    const alt   = lang === 'zh' ? b.titleEn : b.titleZh;
    const type  = lang === 'zh' ? (b.bookTypeZh || b.bookType) : b.bookType;
    const tagline = lang === 'zh' ? b.taglineZh : b.taglineEn;
    const desc  = lang === 'zh' ? b.descriptionZh : b.descriptionEn;
    const active = b.status === 'active';
    const accent = b.accentColor || '#D4AF37';

    const badge = active
      ? `<span class="text-[10px] font-mono tracking-[0.2em] uppercase" style="color:${accent}">No. ${b.order}</span>`
      : `<span class="text-[10px] font-mono tracking-[0.18em] uppercase text-gray-500 border border-gray-700 rounded-full px-2.5 py-1">${esc(t.soon)}</span>`;

    // feature chips (from feature flags) — everything the book offers beyond "Read/Enter"
    const chipFor = (f) => {
      const meta = featureLabels[f];
      const href = f === 'ask' ? (b.page + '#ask') : (meta.key ? b[meta.key] : null);
      if (!href) return '';
      // The Listen chip is a primary spiritual entry point — make it obvious.
      if (f === 'listen') {
        return `<a href="${href}" class="text-[12px] font-semibold tracking-wider uppercase rounded-full px-4 min-h-[40px] inline-flex items-center gap-1.5 transition-all" style="background:${accent}1f;border:1px solid ${accent}99;color:${accent}">♪ ${esc(meta[lang])}</a>`;
      }
      return `<a href="${href}" class="text-[11px] tracking-wider uppercase text-gray-400 hover:text-[#D4AF37] border border-gray-700/70 hover:border-[#D4AF37]/50 rounded-full px-3 min-h-[36px] inline-flex items-center transition-colors">${esc(meta[lang])}</a>`;
    };
    const chips = active
      ? ['listen', 'worship', 'study', 'deck', 'ask'].filter(f => b.features && b.features[f]).map(chipFor).join('')
      : '';

    // Uniform per-book button logic:
    //   active  -> 中文 (enter in Chinese) · English (enter in English) · feature chips
    //   upcoming-> Coming Soon
    const foot = active
      ? `<div class="mt-6 flex flex-wrap items-center gap-2.5">
           <a href="${b.page}?lang=zh" class="font-semibold text-xs tracking-wider uppercase px-5 py-3 rounded-full transition-all inline-flex items-center gap-1.5 min-h-[46px]"
              style="background:${accent};color:#12161A">中文 <i data-lucide="chevron-right" class="h-3 w-3"></i></a>
           <a href="${b.page}?lang=en" class="font-semibold text-xs tracking-wider uppercase px-5 py-3 rounded-full transition-all inline-flex items-center gap-1.5 min-h-[46px] border"
              style="border-color:${accent}66;color:${accent}">English <i data-lucide="chevron-right" class="h-3 w-3"></i></a>
         </div>
         ${chips ? `<div class="mt-3 flex flex-wrap gap-2">${chips}</div>` : ''}`
      : `<a href="${b.page || '#'}" class="mt-6 inline-flex items-center gap-2 text-xs tracking-[0.16em] uppercase text-gray-400 hover:text-[#D4AF37] border border-gray-700/70 hover:border-[#D4AF37]/50 rounded-full px-4 py-2.5 min-h-[44px] transition-colors">
           <i data-lucide="clock" class="h-3.5 w-3.5"></i> ${esc(t.soon)}
         </a>`;

    return `
      <article class="book ${active ? 'active' : 'upcoming'} border border-gray-800/80 rounded-2xl p-6 md:p-7 flex flex-col bg-gradient-to-br ${b.bgColor}">
        <div class="flex items-center justify-between mb-4">
          <span class="text-[10px] font-mono tracking-[0.22em] uppercase" style="color:${accent}">${esc(type)}</span>
          ${badge}
        </div>
        <h2 class="font-serif text-2xl font-bold text-[#F4F1EA]">${esc(title)} <span class="text-gray-500 text-base font-sans font-light">${esc(alt)}</span></h2>
        <div class="font-serif italic mt-2 text-[15px] leading-snug" style="color:${accent}">${esc(tagline)}</div>
        <p class="text-gray-400 text-sm leading-relaxed font-light mt-4 flex-1">${esc(desc)}</p>
        ${foot}
      </article>`;
  }

  function render() {
    const t = UI[lang];
    document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t[el.dataset.i18n] || ''; });
    document.getElementById('btnZh').classList.toggle('text-[#D4AF37]', lang === 'zh');
    document.getElementById('btnEn').classList.toggle('text-[#D4AF37]', lang === 'en');
    const books = [...bibleRegistry].sort((a, b) => a.order - b.order);
    document.getElementById('books').innerHTML = books.map(cardHtml).join('');
    if (window.lucide) lucide.createIcons();
  }

  window.setLang = function (l) {
    lang = l;
    try { localStorage.setItem('bible_lang', l); } catch (e) {}
    render();
  };

  // init: if arriving on a #/book/view deep link, redirect; else render the library
  if (!gotoHash()) {
    let saved = null; try { saved = localStorage.getItem('bible_lang'); } catch (e) {}
    const nl = (navigator.language || '').toLowerCase();
    lang = saved || (nl.indexOf('zh') === 0 ? 'zh' : 'en');
    render();
  }
</script>
</body>
</html>
