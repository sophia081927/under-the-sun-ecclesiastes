<figure id="slide-2"><h2><span class="number">02 / 17</span> 本卷导读｜真实向神倾诉的祷告与诗歌</h2><button class="slide-open" aria-label="放大第 2 页：本卷导读｜真实向神倾诉的祷告与诗歌"><span class="slide-canvas"><img src="images/psalms-deck-zh/02.webp" width="1376" height="768" loading="lazy" decoding="async" alt="本卷导读｜真实向神倾诉的祷告与诗歌"></span></button><figcaption><p>诗歌书：喜乐、哀哭、悔改与盼望 · 带着真实的自己，来到神面前 · 本套图解聚焦网站精选的11篇</p></figcaption></figure>
<figure id="slide-3"><h2><span class="number">03 / 17</span> 阅读路线｜从你此刻的处境开始</h2><button class="slide-open" aria-label="放大第 3 页：阅读路线｜从你此刻的处境开始"><span class="slide-canvas"><img src="images/psalms-deck-zh/03.webp" width="1376" height="768" loading="lazy" decoding="async" alt="阅读路线｜从你此刻的处境开始"></span></button><figcaption><p>孤独与破碎：23 · 34 · 139 · 惧怕与动荡：27 · 46 · 91 · 121 · 忧闷与不平：42 · 73 · 罪疚与有限：51 · 90</p></figcaption></figure>
<figure id="slide-4"><h2><span class="number">04 / 17</span> 诗篇23｜牧者</h2><button class="slide-open" aria-label="放大第 4 页：诗篇23｜牧者"><span class="slide-canvas"><img src="images/psalms-deck-zh/04.webp" width="1376" height="768" loading="lazy" decoding="async" alt="诗篇23｜牧者"></span></button><figcaption><p class="quotation">因为你与我同在 <span>— 诗篇23:4（节选）</span></p><p>幽谷仍在，牧者同行 · 供应与安歇 · 引导与同在</p><a href="psalms.html?lang=zh#psalm-23">读诗篇 23 →</a></figcaption></figure>
<figure id="slide-5"><h2><span class="number">05 / 17</span> 诗篇27｜惧怕中的光</h2><button class="slide-open" aria-label="放大第 5 页：诗篇27｜惧怕中的光"><span class="slide-canvas"><img src="images/psalms-deck-zh/05.webp" width="1376" height="768" loading="lazy" decoding="async" alt="诗篇27｜惧怕中的光"></span></button><figcaption><p class="quotation">耶和华是我的亮光,是我的拯救,我还怕谁呢? <span>— 诗篇27:1（节选）</span></p><p>在惧怕中，向神举目并等候 · 亮光 · 拯救 · 保障</p><a href="psalms.html?lang=zh#psalm-27">读诗篇 27 →</a></figcaption></figure>
<figure id="slide-6"><h2><span class="number">06 / 17</span> 诗篇34｜靠近伤心的人</h2><button class="slide-open" aria-label="放大第 6 页：诗篇34｜靠近伤心的人"><span class="slide-canvas"><img src="images/psalms-deck-zh/06.webp" width="1376" height="768" loading="lazy" decoding="async" alt="诗篇34｜靠近伤心的人"></span></button><figcaption><p class="quotation">耶和华靠近伤心的人,拯救灵性痛悔的人。 <span>— 诗篇34:18</span></p><p>伤心的时候，也可以向神呼求 · 祂垂听 · 祂靠近</p><a href="psalms.html?lang=zh#psalm-34">读诗篇 34 →</a></figcaption></figure>
<figure id="slide-7"><h2><span class="number">07 / 17</span> 诗篇42｜忧闷的灵魂</h2><button class="slide-open" aria-label="放大第 7 页：诗篇42｜忧闷的灵魂"><span class="slide-canvas"><img src="images/psalms-deck-zh/07.webp" width="1376" height="768" loading="lazy" decoding="async" alt="诗篇42｜忧闷的灵魂"></span></button><figcaption><p class="quotation">我的心哪,你为何忧闷?为何在我里面烦躁? <span>— 诗篇42:5（节选）</span></p><p>我可以忧闷，也可以继续仰望 · 诚实承认感受 · 向神保留盼望</p><a href="psalms.html?lang=zh#psalm-42">读诗篇 42 →</a></figcaption></figure>
<figure id="slide-8"><h2><span class="number">08 / 17</span> 诗篇46｜避难所</h2><button class="slide-open" aria-label="放大第 8 页：诗篇46｜避难所"><span class="slide-canvas"><img src="images/psalms-deck-zh/08.webp" width="1376" height="768" loading="lazy" decoding="async" alt="诗篇46｜避难所"></span></button><figcaption><p class="quotation">神是我们的避难所,是我们的力量,是我们在患难中随时的帮助。 <span>— 诗篇46:1</span></p><p>世界摇动时，向神寻求力量 · 避难所 · 力量 · 随时的帮助</p><a href="psalms.html?lang=zh#psalm-46">读诗篇 46 →</a></figcaption></figure>
<figure id="slide-9"><h2><span class="number">09 / 17</span> 诗篇51｜求你造清洁的心</h2><button class="slide-open" aria-label="放大第 9 页：诗篇51｜求你造清洁的心"><span class="slide-canvas"><img src="images/psalms-deck-zh/09.webp" width="1376" height="768" loading="lazy" decoding="async" alt="诗篇51｜求你造清洁的心"></span></button><figcaption><p class="quotation">神啊,求你为我造清洁的心,使我里面重新有正直的灵。 <span>— 诗篇51:10</span></p><p>把过犯带到神面前，求赦免与更新 · 承认过犯 → 求主洗净 → 求主更新</p><a href="psalms.html?lang=zh#psalm-51">读诗篇 51 →</a></figcaption></figure>
<figure id="slide-10"><h2><span class="number">10 / 17</span> 诗篇73｜当恶人亨通</h2><button class="slide-open" aria-label="放大第 10 页：诗篇73｜当恶人亨通"><span class="slide-canvas"><img src="images/psalms-deck-zh/10.webp" width="1376" height="768" loading="lazy" decoding="async" alt="诗篇73｜当恶人亨通"></span></button><figcaption><p class="quotation">但神是我心里的力量,又是我的福分,直到永远。 <span>— 诗篇73:26（节选）</span></p><p>把不平带到神面前，重新看见福分 · 眼前的得失 · 永远的倚靠</p><a href="psalms.html?lang=zh#psalm-73">读诗篇 73 →</a></figcaption></figure>
<figure id="slide-11"><h2><span class="number">11 / 17</span> 诗篇90｜数算你的日子</h2><button class="slide-open" aria-label="放大第 11 页：诗篇90｜数算你的日子"><span class="slide-canvas"><img src="images/psalms-deck-zh/11.webp" width="1376" height="768" loading="lazy" decoding="async" alt="诗篇90｜数算你的日子"></span></button><figcaption><p class="quotation">求你指教我们怎样数算自己的日子,好叫我们得着智慧的心。 <span>— 诗篇90:12</span></p><p>承认日子有限，求一颗智慧的心 · 永恒的神 · 有限的人生</p><a href="psalms.html?lang=zh#psalm-90">读诗篇 90 →</a></figcaption></figure>
<figure id="slide-12"><h2><span class="number">12 / 17</span> 诗篇91｜至高者的荫下</h2><button class="slide-open" aria-label="放大第 12 页：诗篇91｜至高者的荫下"><span class="slide-canvas"><img src="images/psalms-deck-zh/12.webp" width="1376" height="768" loading="lazy" decoding="async" alt="诗篇91｜至高者的荫下"></span></button><figcaption><p class="quotation">他是我的避难所,是我的山寨,是我的神,是我所倚靠的。 <span>— 诗篇91:2（节选）</span></p><p>在风暴中，学习投靠神 · 住在 · 倚靠 · 投靠</p><a href="psalms.html?lang=zh#psalm-91">读诗篇 91 →</a></figcaption></figure>
<figure id="slide-13"><h2><span class="number">13 / 17</span> 诗篇121｜帮助从何而来</h2><button class="slide-open" aria-label="放大第 13 页：诗篇121｜帮助从何而来"><span class="slide-canvas"><img src="images/psalms-deck-zh/13.webp" width="1376" height="768" loading="lazy" decoding="async" alt="诗篇121｜帮助从何而来"></span></button><figcaption><p class="quotation">我的帮助从造天地的耶和华而来。 <span>— 诗篇121:2</span></p><p>向造天地的主寻求帮助 · 举目 · 交托 · 旅途中的看顾</p><a href="psalms.html?lang=zh#psalm-121">读诗篇 121 →</a></figcaption></figure>
<figure id="slide-14"><h2><span class="number">14 / 17</span> 诗篇139｜你已经认识我</h2><button class="slide-open" aria-label="放大第 14 页：诗篇139｜你已经认识我"><span class="slide-canvas"><img src="images/psalms-deck-zh/14.webp" width="1376" height="768" loading="lazy" decoding="async" alt="诗篇139｜你已经认识我"></span></button><figcaption><p class="quotation">耶和华啊,你已经鉴察我,认识我。 <span>— 诗篇139:1</span></p><p>你认识我，也引导我走正路 · 认识 · 同在 · 扶持 · 鉴察</p><a href="psalms.html?lang=zh#psalm-139">读诗篇 139 →</a></figcaption></figure>
<figure id="slide-15"><h2><span class="number">15 / 17</span> 默想与回应｜今天，向神说一句真话</h2><button class="slide-open" aria-label="放大第 15 页：默想与回应｜今天，向神说一句真话"><span class="slide-canvas"><img src="images/psalms-deck-zh/15.webp" width="1376" height="768" loading="lazy" decoding="async" alt="默想与回应｜今天，向神说一句真话"></span></button><figcaption><p>说出真实感受 · 读一段经文 · 用自己的话向神回应</p></figcaption></figure>
