# Cloudflare Worker config for the prayer generator.
# Deploy with:  npx wrangler deploy   (after `npx wrangler secret put ANTHROPIC_API_KEY`)
# Deploy with Wrangler to include scripture assets and rate limiting.

name = "light-of-life-prayer"
main = "prayer-worker-standalone.js"
compatibility_date = "2026-01-01"

# Optional non-secret variables (the API key is a SECRET, set separately — never put it here):
[vars]
MODEL = "claude-opus-5"
EFFORT = "medium"
# ALLOWED_ORIGINS = "https://lightoflifebible.org,https://www.lightoflifebible.org,https://sophia081927.github.io"

# Canonical chapter files deploy atomically with the Worker.
[assets]
directory = "./scripture-assets"
binding = "SCRIPTURE_ASSETS"
run_worker_first = true

[[ratelimits]]
name = "PRAYER_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 6, period = 60 }
