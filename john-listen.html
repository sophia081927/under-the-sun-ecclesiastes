<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#14161a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>约翰福音 · 聆听 · John Listening</title>
<meta name="description" content="约翰福音聆听模式 — 第 1 至 21 章,读、听、默想。John Listening Mode — chapters 1–21.">
<style>
  :root{--bg:#14161a;--bg2:#1b1e24;--bg3:#22262e;--ink:#ece7dd;--muted:#9a948a;--faint:#6f6a62;--sun:#d9a441;--sun-soft:#e8c77e;--line:rgba(217,164,65,.22);--line-soft:rgba(236,231,221,.10)}
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{background:radial-gradient(120% 55% at 50% -8%, rgba(217,164,65,.06), transparent 60%),var(--bg);color:var(--ink);
    font-family:Georgia,"Songti SC","Noto Serif SC",serif;line-height:1.85;-webkit-font-smoothing:antialiased;padding-bottom:110px}
  .wrap{max-width:680px;margin:0 auto;padding:0 20px}
  a{color:var(--sun-soft);text-decoration:none}
  .top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;padding:13px 18px;
    background:linear-gradient(var(--bg),rgba(20,22,26,.82),transparent);font-size:13px}
  .top .back{color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .lang-toggle{display:inline-flex;border:1px solid var(--line);border-radius:30px;overflow:hidden}
  .lang-toggle button{background:transparent;border:none;color:var(--muted);font-family:inherit;font-size:12px;padding:7px 13px;cursor:pointer;min-height:34px}
  .lang-toggle button.active{background:var(--sun);color:#14161a;font-weight:700}
  .hero{text-align:center;padding:44px 20px 6px}
  .hero .ky{color:var(--sun);font-size:12px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:16px}
  .hero h1{font-size:clamp(28px,7vw,42px);font-weight:600;line-height:1.2}
  .hero h1 .sub{display:block;font-size:.42em;color:var(--sun-soft);margin-top:10px;letter-spacing:.06em;font-style:italic}
  .notice{margin:22px auto 0;max-width:560px;border:1px solid var(--line-soft);background:var(--bg2);border-radius:12px;padding:16px 18px;color:var(--muted);font-size:14.5px;line-height:1.7}
  .notice a{color:var(--sun-soft)}
  section.blk{padding:24px 0}
  h2.sec{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--sun);margin:14px 0 10px}
  .clist{display:grid;gap:9px}
  .crow{display:flex;align-items:center;gap:14px;border:1px solid var(--line-soft);border-radius:11px;background:var(--bg2);padding:13px 15px;min-height:60px}
  .crow .idx{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--sun);font-size:13px;font-style:italic}
  .crow .t{flex:1;min-width:0;font-size:15.5px;color:var(--ink);line-height:1.4}
  .crow .tag{flex:none;font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);border:1px solid var(--line-soft);border-radius:20px;padding:5px 10px}
  footer{text-align:center;color:var(--faint);font-size:12px;padding:34px 20px 10px;border-top:1px solid var(--line-soft)}
  .mini{position:fixed;left:0;right:0;bottom:0;z-index:60;background:rgba(24,27,32,.92);backdrop-filter:blur(12px);
    border-top:1px solid var(--line);padding:12px 16px calc(12px + env(safe-area-inset-bottom));display:flex;align-items:center;gap:12px;opacity:.75}
  .mini .pp{width:46px;height:46px;border-radius:50%;background:var(--bg3);color:var(--faint);border:1px solid var(--line-soft);display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
  .mini .mt{flex:1;min-width:0;font-size:13.5px;color:var(--muted)}
  .mini .mt small{display:block;color:var(--faint);font-size:11.5px}
  .tabbar{position:fixed;left:0;right:0;bottom:0;z-index:55;display:none}
  @media(max-width:700px){body{padding-bottom:116px}}
</style>
</head>
<body class="lang-zh" data-book="john">
  <div class="top">
    <a class="back" href="john.html">‹ <span class="lz">约翰福音</span><span class="le" style="display:none">John</span></a>
    <div class="lang-toggle"><button id="bz" class="active" onclick="setLang('zh')">中文</button><button id="be" onclick="setLang('en')">EN</button></div>
  </div>
  <div class="hero">
    <div class="ky" id="ky"></div>
    <h1 id="h1"></h1>
    <div class="notice" id="notice"></div>
  </div>
  <div class="wrap">
    <section class="blk"><div id="media"></div></section>
    <h2 class="sec" id="chHead"></h2>
    <section class="blk"><div class="clist" id="chapters"></div></section>
  </div>
  <footer>生命之光 · the light of life · <a href="index.html" id="lib"></a></footer>

  <!-- mini-player: ready for real audio (disabled placeholder for now) -->
  <div class="mini" id="mini">
    <div class="pp">♪</div>
    <div class="mt" id="miniText"></div>
  </div>

<script type="module">
  import { getBookById } from './data/bibleRegistry.js';
  import { renderBookMediaPanel } from './components/bookMediaPanel.js';
  import { johnAudio } from './data/audio/johnAudio.js';

  const BOOK='john';
  const book=getBookById(BOOK);
  const T={ zh:{ ky:'聆听模式', sub:'读 · 听 · 默想', ch:'章节 · 第 1–21 章', soon:'录音筹备中', lib:'圣经书阁',
              mini:'录音即将推出', miniSub:'架构已就绪,放入 MP3 即可播放',
              notice:'完整中英文录音正在筹备中。现在你已经可以 <a href="john-study.html">阅读双语导览</a>,或在 <a href="john.html#ask">Ask</a> 提问。' },
            en:{ ky:'Listening mode', sub:'read · listen · reflect', ch:'Chapters · John 1–21', soon:'Audio soon', lib:'Bible Library',
              mini:'Narration coming soon', miniSub:'Architecture is ready — drop in MP3s to play',
              notice:'Full Chinese & English narration is in preparation. For now you can <a href="john-study.html">read the bilingual guided study</a>, or <a href="john.html#ask">ask a question</a>.' } };
  let lang='zh';
  function render(){
    const t=T[lang];
    document.documentElement.lang=lang==='zh'?'zh-CN':'en';
    document.getElementById('bz').classList.toggle('active',lang==='zh');
    document.getElementById('be').classList.toggle('active',lang==='en');
    document.querySelector('.lz').style.display=lang==='zh'?'inline':'none';
    document.querySelector('.le').style.display=lang==='zh'?'none':'inline';
    document.getElementById('ky').textContent=t.ky;
    document.getElementById('h1').innerHTML=(lang==='zh'?book.titleZh:book.titleEn)+' · '+(lang==='zh'?'聆听':'Listening')+'<span class="sub">'+t.sub+'</span>';
    document.getElementById('notice').innerHTML=t.notice;
    document.getElementById('chHead').textContent=t.ch;
    document.getElementById('lib').textContent=t.lib;
    document.getElementById('miniText').innerHTML=t.mini+'<small>'+t.miniSub+'</small>';
    document.title=(lang==='zh'?book.titleZh:book.titleEn)+' · '+(lang==='zh'?'聆听':'Listening');
    renderBookMediaPanel(document.getElementById('media'), BOOK, lang);
    document.getElementById('chapters').innerHTML = johnAudio.chapters.map(c=>`
      <div class="crow">
        <div class="idx">${c.num}</div>
        <div class="t">${lang==='zh'?('第 '+c.num+' 章 · '+c.titleZh):('Ch. '+c.num+' · '+c.titleEn)}</div>
        <div class="tag">${t.soon}</div>
      </div>`).join('');
  }
  window.setLang=(l)=>{lang=l;try{localStorage.setItem('bible_lang',l);}catch(e){}render();};
  let saved=null;try{saved=localStorage.getItem('bible_lang');}catch(e){}
  const nl=(navigator.language||'').toLowerCase(); lang=saved||(nl.indexOf('zh')===0?'zh':'en'); render();
</script>
</body>
</html>
